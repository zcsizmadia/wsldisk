# Rules that catch real readability problems stay on. The two disabled below are
# stylistic and would mean rewriting documents that read fine as they are.
default: true

MD013: false   # line length is enforced by review, not a linter
MD024:
  siblings_only: true
MD033: false   # inline HTML is allowed in docs tables
MD041: false   # files may start with a badge block

# `**Repo & tooling**` above a checklist groups the list; it is not a heading,
# and promoting it to one would put it in every table of contents.
MD036: false

# The documents mix `_emphasis_` and `*emphasis*`; both read fine and
# normalising them would churn prose for no reader benefit.
MD049: false

# Table pipe spacing. Added in markdownlint 0.41 and it flagged 44 existing
# tables the moment the action was bumped. The compact `|---|---|` form is what
# these documents use and it renders identically; padding every cell to align
# would be a large diff that no reader benefits from, and it would go stale the
# first time a cell's text changes length.
MD060: false
