version: 2

updates:
  # vcpkg has no Dependabot ecosystem; the manifest baseline is bumped weekly by
  # .github/workflows/vcpkg-baseline.yml instead.
  #
  # Each directory needs its own entry, and `groups` is per-entry: without one on
  # every entry the composite actions raise a separate pull request per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-toolchain
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github/actions/wsl-fixture
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github/actions/wsl-cleanup
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:ci
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
