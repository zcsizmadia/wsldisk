name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new query pack finds old code even when nothing changes.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze c-cpp
    runs-on: windows-2025
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: ./.github/actions/setup-toolchain

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # Manual build mode: CodeQL needs to observe the real compiler invocations,
      # and vcpkg dependencies have to be restored first.
      - name: Build
        shell: pwsh
        run: |
          cmake --preset x64-debug
          cmake --build build/x64-debug --config Debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          category: /language:c-cpp
