name: codeql

# Not on pull requests. The analysis takes about seven minutes, which made it
# the slowest thing gating every change, and it examines whole-program dataflow
# rather than a diff -- a finding it reports on a branch is a finding it reports
# on main a few minutes later. Running it on main and weekly keeps the coverage
# without putting it on the critical path of every review.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new query pack finds old code even when nothing changes.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze c-cpp
    runs-on: windows-2025
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # Manual build mode: CodeQL needs to observe the real compiler invocations,
      # and vcpkg dependencies have to be restored first.
      - name: Build
        shell: pwsh
        run: |
          cmake --preset x64-debug
          cmake --build build/x64-debug --config Debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: /language:c-cpp
