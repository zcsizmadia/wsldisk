name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching

jobs:
  # Fast checks: no C++ toolchain, so no vcpkg restore and no LLVM install.
  # These run on every pull request because they cost seconds and because
  # markdownlint cannot run on a developer machine behind a proxy that cannot
  # reach the npm registry -- CI is the only place it happens.
  lint:
    name: lint (markdown, actions, python)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            **/*.md
            !build/**

      - name: actionlint
        shell: pwsh
        run: |
          $version = '1.7.12'
          $url = "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile actionlint.zip -UseBasicParsing
          Expand-Archive actionlint.zip -DestinationPath actionlint-bin
          ./actionlint-bin/actionlint.exe -color

      # The coverage gate is the check that stops undertested code shipping, so
      # it gets linted and tested like anything else.
      - name: Lint and test the coverage gate
        shell: pwsh
        run: |
          python -m pip install --quiet ruff pytest
          python -m ruff check scripts/
          python -m pytest scripts/tests -q

  # clang-format and clang-tidy need the pinned LLVM and a compile database,
  # which means a vcpkg restore and a choco install -- about six minutes, and
  # the slowest thing gating a pull request.
  #
  # They run on main rather than on every push to a branch. Both tools are
  # pinned and deterministic, `scripts/lint.ps1` runs exactly the same pair
  # locally, and since it now refuses to run on any version other than the
  # pinned one, a local pass means the same thing CI would have said. The trade
  # is explicit: a formatting or clang-tidy slip that was not run locally lands
  # on main and is fixed forward there instead of blocking the pull request.
  lint-native:
    name: lint (clang-format, clang-tidy)
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          llvm: 'true'

      # The runner image ships Visual Studio's LLVM as well as the pinned one,
      # and which wins is a matter of PATH order. Assert it rather than assume
      # it: VS's clang-format reformats differently, so silently using it would
      # fail this job on files that are correct, and VS's clang-tidy crashes on
      # the MSVC C++23 headers.
      - name: Check the LLVM tools are the pinned version
        shell: pwsh
        run: |
          $pinned = (Select-String -Path .github/actions/setup-toolchain/action.yml `
              -Pattern "^\s*default:\s*'([0-9]+\.[0-9]+\.[0-9]+)'" | Select-Object -First 1
              ).Matches[0].Groups[1].Value
          foreach ($tool in 'clang-format', 'clang-tidy') {
              $source = (Get-Command $tool).Source
              $actual = (& $tool --version |
                  Select-String -Pattern 'version\s+([0-9]+\.[0-9]+\.[0-9]+)'
                  ).Matches[0].Groups[1].Value
              Write-Host "$tool $actual  $source"
              if ($actual -ne $pinned) {
                  throw "$tool is $actual at $source, expected the pinned $pinned"
              }
          }

      - name: clang-format
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path src, tests -Include *.cpp, *.h, *.in |
              ForEach-Object { $_.FullName }
          clang-format --dry-run --Werror @files

      # Single-config generator on purpose: a multi-config compile_commands.json
      # lists every source once per configuration, which would triple lint time.
      - name: Configure (for compile_commands.json)
        shell: pwsh
        run: cmake --preset x64-lint

      # Blocking. The pinned LLVM (see setup-toolchain) parses the MSVC C++23
      # headers cleanly; clang-tidy 18, which ships with VS, crashes on them, so
      # the version must stay pinned rather than floating.
      - name: clang-tidy
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path src -Include *.cpp | ForEach-Object { $_.FullName }
          # The unused-argument diagnostics come from the driver, before the check
          # filter in .clang-tidy can suppress them.
          clang-tidy -p build/x64-lint --extra-arg=-Wno-unused-command-line-argument @files

  build-test:
    name: ${{ matrix.toolchain }} ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, clang-cl]
        architecture: [x64, arm64]
        configuration: [Debug, Release]
        include:
          - architecture: x64
            runner: windows-2025
          # arm64 builds run on native arm64 hardware rather than cross-compiling,
          # so the tests actually execute instead of being built and skipped.
          - architecture: arm64
            runner: windows-11-arm
        exclude:
          # clang-cl is a second-opinion compiler, and there is no arm64 Windows
          # LLVM in the runner image; MSVC covers the arm64 legs.
          - toolchain: clang-cl
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          architecture: ${{ matrix.architecture }}
          llvm: ${{ matrix.toolchain == 'clang-cl' }}

      - name: Resolve the preset
        id: preset
        shell: pwsh
        run: |
          $preset = switch ('${{ matrix.toolchain }}-${{ matrix.architecture }}') {
            'msvc-x64'     { 'x64-debug' }
            'msvc-arm64'   { 'arm64-release' }
            'clang-cl-x64' { 'x64-clang' }
          }
          "name=$preset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ steps.preset.outputs.name }}

      - name: Build
        shell: pwsh
        run: cmake --build build/${{ steps.preset.outputs.name }} --config ${{ matrix.configuration }}

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build/${{ steps.preset.outputs.name }} -C ${{ matrix.configuration }} -L unit --output-on-failure

      - name: Contract tests
        shell: pwsh
        run: ctest --test-dir build/${{ steps.preset.outputs.name }} -C ${{ matrix.configuration }} -L contract --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-${{ matrix.toolchain }}-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: build/${{ steps.preset.outputs.name }}/test-results/*.xml
          if-no-files-found: warn

  coverage:
    name: coverage gate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          llvm: 'true'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-coverage

      - name: Build
        shell: pwsh
        run: cmake --build build/x64-coverage --config Debug

      # The `coverage` target runs ctest, merges the profiles, writes the lcov and
      # HTML reports and fails if any of the three thresholds is missed.
      - name: Run tests and enforce 100% coverage
        shell: pwsh
        run: cmake --build build/x64-coverage --config Debug --target coverage

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-html
          path: build/x64-coverage/coverage-html
          if-no-files-found: warn

      # The gate is check-coverage.py, which has already run by this point.
      # Codecov is reporting, so a missing token or a flaky upload must not turn a
      # passing build red -- and without a token the upload cannot work at all.
      - name: Upload to Codecov
        if: always() && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: build/x64-coverage/coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  asan:
    name: AddressSanitizer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # MSVC's ASan, not clang-cl's -- see docs/CI.md; no LLVM needed.
      - uses: ./.github/actions/setup-toolchain

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-asan

      - name: Build
        shell: pwsh
        run: cmake --build build/x64-asan --config Debug

      - name: Unit and contract tests under ASan
        shell: pwsh
        run: ctest --test-dir build/x64-asan -C Debug -L "unit|contract" --output-on-failure

  fuzz-corpus:
    name: fuzz corpus
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          llvm: 'true'

      # Builds the fuzz targets and replays the checked-in corpus once. This is
      # not fuzzing -- nightly.yml does that with a time budget -- it is
      # regression cover, so an input that once found a bug keeps being checked
      # on every pull request.
      - name: Build and replay
        shell: pwsh
        run: |
          cmake --preset x64-fuzz
          cmake --build build/x64-fuzz --config Release
          ctest --test-dir build/x64-fuzz -C Release -L fuzz --output-on-failure

  integration:
    name: integration (WSL2)
    runs-on: windows-2025
    # Forks cannot reach the WSL fixture cache or secrets, and importing distros
    # on a shared runner is worth gating; maintainers opt a PR in with a label.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Configure
        shell: pwsh
        run: cmake --preset x64-debug

      - name: Build
        shell: pwsh
        run: cmake --build build/x64-debug --config Debug

      - id: fixture
        uses: ./.github/actions/wsl-fixture

      - name: Integration tests
        shell: pwsh
        run: ctest --test-dir build/x64-debug -C Debug -L integration --output-on-failure

      - name: Clean up scratch distros
        if: always()
        uses: ./.github/actions/wsl-cleanup
        with:
          location: ${{ steps.fixture.outputs.location }}

  package:
    name: package ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/setup-toolchain
        with:
          architecture: ${{ matrix.architecture }}

      - name: Resolve the preset
        id: preset
        shell: pwsh
        run: |
          $preset = if ('${{ matrix.architecture }}' -eq 'x64') { 'x64-release' } else { 'arm64-release' }
          "name=$preset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Release
        shell: pwsh
        run: |
          cmake --preset ${{ steps.preset.outputs.name }}
          cmake --build build/${{ steps.preset.outputs.name }} --config Release

      # Runs natively on both architectures now, so the arm64 artifact is known to
      # start rather than merely to have linked.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build/${{ steps.preset.outputs.name }}/src/cli/Release/wsldisk.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "wsldisk --version exited with $LASTEXITCODE" }

      - name: Zip
        shell: pwsh
        run: |
          $staging = 'staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "build/${{ steps.preset.outputs.name }}/src/cli/Release/wsldisk.exe" $staging
          Copy-Item LICENSE, README.md $staging
          $zip = "wsldisk-${{ matrix.architecture }}.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" |
              Out-File -FilePath SHA256SUMS -Encoding ascii

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wsldisk-${{ matrix.architecture }}
          path: |
            wsldisk-${{ matrix.architecture }}.zip
            SHA256SUMS
